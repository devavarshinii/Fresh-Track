 const k=res.proposed?(()=>{const a=base.proposed.o,b=res.proposed.o;return`<div class="kg">${kpi("Likely waste",Math.round(b.waste)+" units","was "+Math.round(a.waste))}${kpi("Likely shortfall",Math.round(b.so)+" units",`was ${Math.round(a.so)} · risk ${b.sl.toLowerCase()}`)}${kpi("My advice",AL[res.action],"was "+AL[base.action])}${kpi("Suggested order",res.rec.q,"was "+base.rec.q)}</div>`})():"";
 return`<h1>What-if</h1><p class="sub">Push demand, deliveries and dates around and see how my advice changes. Nothing here touches your real stock.</p>${demo}
 <label>Pick a story${sel("sm.pick",PREP.map((x,i)=>[i,x.t]),s.pick)}</label><div class="card">${PREP[s.pick].x}</div>
 <div class="row"><label>Store${sel("sm.store",STORES(),s.store)}</label><label>Product${sel("sm.sku",D.products.filter(x=>x.store==s.store).map(x=>[x.sku,x.product]),s.sku)}</label><label>Order size${num("sm.qty",s.qty)}</label></div>
 <div class="sg">${sld("sm.day",s.day,1,14,1,"Arrives in (days)")}${sld("sm.dem",s.dem,.3,2,.05,"Demand vs forecast (×)")}${sld("sm.inc",s.inc,0,2,.1,"Incoming deliveries (×)")}${sld("sm.delay",s.delay,0,7,1,"Deliveries late by (days)")}${sld("sm.shift",s.shift,-3,3,1,"Dates move by (days)")}</div>
 ${k}${decision(res,"sim",true)}`};
P["Decisions"]=()=>{const o=PEND.find(x=>x.id==S.ap.oid)||PEND[0];if(o)S.ap.oid=o.id;
 return`<h1>Decisions</h1><p class="sub">Open an order, read my reasoning, then approve it, change it or keep your own plan. Every choice is kept in a log.</p>${demo}
 ${o?`${sel("ap.oid",PEND.map(x=>[x.id,`${x.p.product} · ${x.p.store} · ${x.qty} units → ${AL[x.res.action]}`]),o.id)}<div class="banner" style="background:${AC[o.res.action]}"><small>${AL[o.res.action]}</small>${H(o.res.headline)}</div>
 <h4>Why</h4><ul class="why">${o.res.reasons.map(x=>`<li>${H(x)}</li>`).join("")}</ul>${approval(o.res,"q:"+o.id)}`:`<div class="note">No orders are waiting. Check a new one in the Order Gate.</div>`}
 <h3>Your decision log</h3>${LOG.length?tbl(["When","Order","What I said","What you chose","Result","Your reason"],LOG.map(l=>[l.ts,H(l.order),H(l.ai),l.dec,H(l.fin),H(l.reason)])):"Nothing logged yet."}
 <div class="row"><button class="btn ghost" data-a="exportlog">Download log (CSV)</button></div><p class="cap">The log lives in this browser on this device. It isn't shared and disappears if you clear browser data, so download it if it matters.</p>`};
P["Compare"]=()=>{const e=evalLive(),b=e.b,s=e.s,f=x=>Math.round(x).toLocaleString("en-IN");
 const M=[["Units ordered","q",f],["Units wasted","waste",f],["Waste value","wv",x=>money(x)],["Days with something out of stock","sod",f],["Units short","so",f],["Sales minus order cost","net",x=>money(x)],["Rule breaks (minimum, pack, capacity)","viol",f]];
 return`<h1>Compare</h1><p class="sub">How does checking orders with ${H(CFG.brand)} compare with just ordering up to ${7} days of sales?</p>${demo}
 <p>I replay <b>${e.n} made-up situations</b> built from your current stock. Real demand lands anywhere from 0.6× to 1.4× the forecast, and some deliveries are 1–2 days late. The simple policy orders as it always would; ${H(CFG.brand)} reviews that same order. Both face the same random demand. The results change when you edit your stock.</p>
 ${tbl(["","Simple policy",H(CFG.brand)],M.map(([l,k,fm])=>[l,fm(b[k]),fm(s[k])]))}
 <div class="two"><div class="card"><h4>Units wasted</h4>${hbar([{l:"Simple policy",v:b.waste,c:"#97a09a"},{l:CFG.brand,v:s.waste}])}</div><div class="card"><h4>Units short</h4>${hbar([{l:"Simple policy",v:b.so,c:"#97a09a"},{l:CFG.brand,v:s.so}])}</div></div>
 <div class="warn"><b>Read this honestly:</b> these are simulated results, not real-world savings. ${s.so>b.so?`${H(CFG.brand)} wastes less but runs short more often here. It trades some availability for freshness. If that's not the trade you want, raise the cost of running out in Settings.`:s.waste<b.waste?`${H(CFG.brand)} wastes less here without running short more often.`:`${H(CFG.brand)} doesn't beat the simple policy on waste with the current data.`}</div>
 <details><summary>How each number is worked out</summary><ul class="why"><li>Daily demand is drawn at random around (recent average × the scenario's demand level), with the same draws for both policies.</li><li>Waste means units still on the shelf on their expiry date. The oldest stock is sold first.</li><li>Sales minus order cost ignores the cost of stock you already held.</li><li>A rule break is an order under the minimum, off pack size or over capacity.</li></ul></details>
 <details><summary>Situation by situation</summary>${tbl(["#","Product","Store","Policy","Ordered","Wasted","Days short","Units short","Net","Rule breaks"],e.rows.map(r=>[r.id,H(r.product),r.store,r.policy,r.q,Math.round(r.waste),r.sod,Math.round(r.so),f(r.net),r.viol]))}</details>`};
P["Settings"]=()=>{const t=(l,f,v,k="cfg",ty="t")=>ein(k,f,v,undefined,ty,l);
 return`<h1>Settings</h1><p class="sub">Make it yours. Rename it, change the numbers I assume, or start over with your own data.</p>
 <h3>Look and wording</h3><div class="card"><div class="fg">${t("App name","brand",CFG.brand)}${t("Tagline","tagline",CFG.tagline)}${t("Your name (for the greeting)","user",CFG.user||"")}${t("Currency symbol","cur",CFG.cur)}
 <label>Accent colour<input type="color" data-e="cfg" data-f="accent" value="${CFG.accent}"></label></div></div>
 <h3>What I assume</h3><div class="card"><div class="fg">${t("Cost of running out (× the profit on a unit)","pen",C.pen,"asm","n")}${t("Moving stock costs (per unit)","tcost",C.tcost,"asm","n")}${t("Smallest worthwhile transfer (units)","minT",C.minT,"asm","n")}
 ${t("Markdown effect (% more sold per 1% off)","el",C.el,"asm","n")}${t("Furthest I may push a delivery back (days)","maxDelay",C.maxDelay,"asm","n")}${t("Waste counts as 'medium' above (%)","lo",C.lo*100,"asm","n")}${t("…and 'high' above (%)","hi",C.hi*100,"asm","n")}${t("Days of sales I average for the forecast (3–14)","ma",C.ma,"asm","n")}</div>
 <p class="cap">A higher cost of running out makes me order more freely. A lower one makes me stricter about waste.</p></div>
 <h3>Your data</h3><div class="card"><div class="row"><button class="btn ghost" data-a="backup">Download a backup</button><label>Restore a backup<input type="file" accept=".json" data-a="restore"></label>
 <button class="btn danger" data-a="reset">${S.rst?"Click again to wipe everything and restore the practice data":"Reset to practice data"}</button></div><div class="msg">${S.setMsg||""}</div>
 <p class="cap">Everything is stored in this browser on this device only.</p></div>`};
// ---- render + events
function render(){const y=window.scrollY;document.title=CFG.brand+" · "+CFG.tagline;document.documentElement.style.setProperty("--g",CFG.accent);
 document.getElementById("bn").textContent=CFG.brand;document.getElementById("bt").textContent=CFG.tagline;
 document.getElementById("nav").innerHTML=PAGES.map(p=>`<button class="${p==S.page?"on":""}" data-a="nav" data-v="${p}">${p}</button>`).join("");
 document.getElementById("main").innerHTML=P[S.page]();window.scrollTo(0,y)}
const setPath=(k,v)=>{const[a,b]=k.split(".");S[a][b]=v},dl=(name,txt,type)=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}catch(e){}};
function editField(E,f,i,v,n){const p=PR[S.ed],val=n?Number(v):v;
 if(E=="p"){p[f]=n?(isNaN(val)?p[f]:Math.max(0,val)):v}
 else if(E=="sales"){const old=mean(p.sales.u.slice(-7))||0;p.sales.u=old>0?p.sales.u.map(x=>x*val/old):p.sales.u.map(()=>val);p.sales.n=Math.max(p.sales.n,14)}
 else if(E=="lot"){p.lots[i][f]=val}else if(E=="inc"){p.inc[i][f]=val}
 else if(E=="add"){S.add[f]=n?val:v}
 else if(E=="cfg"){CFG[f]=v}else if(E=="asm"){C[f]=(f=="lo"||f=="hi")?val/100:val}
 if(E!="add")save();recompute()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName=="INPUT")return;const a=t.dataset.a,v=t.dataset.v;if(t.tagName=="A")e.preventDefault();
 const nav=pg=>{S.page=pg;window.scrollTo(0,0)};
 if(a=="nav")nav(v);
 else if(a=="go"){if(t.dataset.f){const[k,val]=t.dataset.f.split("=");if(k.startsWith("inv.")){S.inv={q:"",store:"All",risk:"All",srisk:"All"}}setPath(k,val)}nav(v)}
 else if(a=="scroll"){render();const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:"smooth"});return}
 else if(a=="sf")S.sf=v;
 else if(a=="rungate")setGate();
 else if(a=="record")record(curRes());
 else if(a=="accept"||a=="keep")decideQ(v,a=="accept"?"accept":"keep");
 else if(a=="look"){const o=PEND.find(x=>x.id==v);Object.assign(S.g,{store:o.p.store,sku:o.p.sku,qty:o.qty,day:o.day});setGate();nav("Order Gate")}
 else if(a=="open"){const[s,st]=v.split("|"),p=PR[v];if(p){Object.assign(S.g,{store:st,sku:s});const pe=D.pending.find(o=>o.sku==s&&o.store==st);S.g.qty=pe?pe.qty:p.pack*5;S.g.day=pe?pe.day:p.lead;setGate();nav("Order Gate")}}
 else if(a=="sug")doSug(Number(v));
 else if(a=="edit"){S.ed=v;S.delp=false;S.add=null}
 else if(a=="closeedit"){S.ed=null;S.delp=false}
 else if(a=="addlot"){const p=PR[S.ed];p.lots.push({id:`${p.sku}-${p.store.slice(-1)}-N${SEQ++}`,qty:10,exp:Math.min(p.shelf,5)});save();recompute()}
 else if(a=="dellot"){PR[S.ed].lots.splice(Number(v),1);save();recompute()}
 else if(a=="addinc"){const p=PR[S.ed];p.inc.push({id:`IN-${SEQ++}`,qty:p.pack*2,arr:p.lead,exp:p.lead+p.shelf});save();recompute()}
 else if(a=="delinc"){PR[S.ed].inc.splice(Number(v),1);save();recompute()}
 else if(a=="delprod"){if(!S.delp){S.delp=true}else{const p=PR[S.ed];D.products=D.products.filter(x=>x!==p);D.pending=D.pending.filter(o=>!(o.sku==p.sku&&o.store==p.store));S.ed=null;S.delp=false;save();recompute()}}
 else if(a=="addprod"){S.add=ADD0();S.addMsg="";S.ed=null}
 else if(a=="canceladd")S.add=null;
 else if(a=="saveadd"){const x=S.add,m=[];if(!x.product.trim())m.push("give it a name");if(!x.sku.trim())m.push("give it a short code");if(!x.store.trim())m.push("pick a store");
  if(D.products.some(p=>p.sku==x.sku.trim()&&p.store==x.store.trim()))m.push("that code already exists in that store");if(!(x.pack>0))m.push("pack size must be above 0");if(!(x.daily>0))m.push("sales per day must be above 0");
  if(m.length)S.addMsg="⚠️ Please "+m.join(", ")+".";else{const u=Array(14).fill(Number(x.daily)),sku=x.sku.trim(),st=x.store.trim();
   D.products.push({sku,product:x.product.trim(),cat:x.cat,store:st,shelf:x.shelf,cost:x.cost,price:x.price,moq:x.moq,pack:x.pack,cap:x.cap,safety:x.safety,lead:x.lead,cycle:x.cycle,sales:{n:14,u},lots:x.qty>0?[{id:`${sku}-${st.slice(-1)}-L1`,qty:x.qty,exp:Math.max(1,x.exp)}]:[],inc:[]});
   S.ed=sku+"|"+st;S.add=null;save();recompute()}}
 else if(a=="exportlog"){dl("decision-log.csv",["When,Order,What I said,What you chose,Result,Your reason",...LOG.map(l=>[l.ts,l.order,l.ai,l.dec,l.fin,l.reason].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(","))].join("\n"),"text/csv")}
 else if(a=="backup"){dl("freshgate-backup.json",JSON.stringify({base:todayISO(),products:D.products,pending:D.pending,cfg:CFG,C,log:LOG,seq:SEQ}),"application/json")}
 else if(a=="reset"){if(!S.rst){S.rst=true}else{D.products=JSON.parse(JSON.stringify(D0.products));D.pending=JSON.parse(JSON.stringify(D0.pending));Object.assign(C,C0);Object.assign(CFG,CFG0);LOG=[];SEQ=100;S.rst=false;S.ed=null;S.setMsg="✅ Practice data restored.";save();recompute();setGate()}}
 render()});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.a=="restore"){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const s=JSON.parse(x);D.products=s.products;D.pending=s.pending;Object.assign(CFG,s.cfg);Object.assign(C,s.C);LOG=s.log||[];SEQ=s.seq||100;save();recompute();setGate();S.setMsg="✅ Backup restored."}catch(err){S.setMsg="⚠️ That file doesn't look like a backup."}render()});return}
 if(t.dataset.e){editField(t.dataset.e,t.dataset.f,t.dataset.i===undefined?undefined:Number(t.dataset.i),t.value,t.dataset.t=="n");render();return}
 if(!t.dataset.k)return;const k=t.dataset.k;let v=t.dataset.t=="n"?Number(t.value):t.value;
 if(k=="g.qty"||k=="g.day")v=Math.max(k=="g.day"?1:0,Math.min(k=="g.day"?14:5000,Math.round(v||0)));
 setPath(k,v);
 if(k=="g.store")S.g.sku=D.products.find(p=>p.store==v).sku;
 if(k=="g.store"||k=="g.sku"){const p=gp(),pe=D.pending.find(o=>o.sku==p.sku&&o.store==p.store);S.g.qty=pe?pe.qty:p.pack*5;S.g.day=pe?pe.day:p.lead;setGate()}
 if(k=="sm.pick"){Object.assign(S.sm,PREP[v]);S.sm.pick=Number(v)}
 if(k=="sm.store")S.sm.sku=D.products.find(p=>p.store==v).sku;
 if(k=="ap.oid")S.ap.ref=null;
 render()});
render();

</script></body></html>
